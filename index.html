<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LBA Chat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23111'/><text x='50' y='66' font-size='46' text-anchor='middle' fill='%23fff' font-family='sans-serif' font-weight='700'>L</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside id="sidebar">
  <div class="brand">LBA Chat</div>
  <button id="newChat" class="btn primary">+ New chat</button>
  <div id="chatList"></div>
  <button id="clearAll" class="btn ghost small">Delete all chats</button>
</aside>
<main>
  <header>
    <button id="menu" class="btn ghost">☰</button>
    <span id="title">New chat</span>
  </header>
  <div id="messages"></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Message LBA Chat…"></textarea>
    <button id="send" class="btn primary" type="submit">Send</button>
  </form>
</main>
<script src="app.js"></script>
</body>
</html>
